[package]
name = "philips-log-viewer"
version = "1.6.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11"] }
egui_extras = "0.31.1"
quick-xml = "0.37"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
rfd = "0.15"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jetdb = "0.3.3"
egui_plot = "0.31.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
